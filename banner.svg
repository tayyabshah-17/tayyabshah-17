<svg width="100%" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030810" />
      <stop offset="50%" stop-color="#081120" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .bg-main { fill: url(#cyber-bg); rx: 12px; }
    .grid-layer { fill: url(#grid); }
    .laser-line { animation: laserScan 4s linear infinite; }
    .main-title {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 3px;
      fill: url(#title-grad);
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .sub-title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #FF0055;
    }
    .header-tag {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: #00F0FF;
    }
    .badge-text {
      font-family: 'Consolas', monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #00F0FF;
    }
  </style>

  <!-- Background Base & Grid -->
  <rect width="800" height="320" class="bg-main" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
  <rect width="800" height="320" class="grid-layer" rx="12" />

  <!-- Side Technical Tick Marks -->
  <path d="M 12 120 L 22 120 M 12 130 L 18 130 M 12 140 L 18 140 M 12 150 L 22 150" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 788 120 L 778 120 M 788 130 L 782 130 M 788 140 L 782 140 M 788 150 L 778 150" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Corner Brackets -->
  <path d="M 15 40 L 15 15 L 40 15" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />
  <path d="M 760 15 L 785 15 L 785 40" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />
  <path d="M 15 280 L 15 305 L 40 305" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />
  <path d="M 760 305 L 785 305 L 785 280" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />

  <!-- Constellation Network Left -->
  <g stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1">
    <line x1="40" y1="200" x2="90" y2="270" />
    <line x1="90" y1="270" x2="170" y2="230" />
    <line x1="90" y1="270" x2="190" y2="295" />
  </g>
  <circle cx="40" cy="200" r="4" fill="#00F0FF" filter="url(#neon-glow)" />
  <circle cx="90" cy="270" r="5" fill="#FFFFFF" filter="url(#neon-glow)" />
  <circle cx="170" cy="230" r="4" fill="#00F0FF" filter="url(#neon-glow)" />

  <!-- Constellation Network Right -->
  <g stroke="#A855F7" stroke-opacity="0.3" stroke-width="1">
    <line x1="760" y1="40" x2="700" y2="100" />
    <line x1="700" y1="100" x2="620" y2="60" />
  </g>
  <circle cx="760" cy="40" r="4" fill="#A855F7" />
  <circle cx="700" cy="100" r="5" fill="#00F0FF" filter="url(#neon-glow)" />
  <circle cx="620" cy="60" r="4" fill="#A855F7" />

  <!-- Animated Laser Scanline -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00F0FF" stroke-opacity="0.8" stroke-width="2" class="laser-line" filter="url(#neon-glow)" />

  <!-- Text Section -->
  <text x="50%" y="65" text-anchor="middle" class="header-tag" filter="url(#neon-glow)">⚡ WELCOME TO MY GITHUB SPACE</text>

  <text x="50%" y="135" text-anchor="middle" class="main-title" filter="url(#neon-glow)">MUHAMMAD TAYYAB SHAH</text>

  <text x="50%" y="175" text-anchor="middle" class="sub-title">SOFTWARE ENGINEERING STUDENT @ CUST ISLAMABAD</text>

  <!-- Bottom Badge Box -->
  <rect x="280" y="210" width="240" height="42" rx="10" fill="#030810" fill-opacity="0.9" stroke="#00F0FF" stroke-opacity="0.8" stroke-width="1.5" filter="url(#neon-glow)" />
  <text x="50%" y="237" text-anchor="middle" class="badge-text">> Systems Builder</text>
</svg>
