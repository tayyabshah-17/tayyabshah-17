<svg width="100%" height="360" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cyberpunk Background -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050A" />
      <stop offset="40%" stop-color="#08101C" />
      <stop offset="80%" stop-color="#050A14" />
      <stop offset="100%" stop-color="#010306" />
    </linearGradient>

    <!-- Neon Title Multi-Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#E0F7FA" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-opacity="0.07" stroke-width="0.8" />
    </pattern>

    <!-- High Intensity Neon Blur Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purple-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 1. Terminal Cursor Blinking Animation */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* 2. Laser Scanline Movement */
    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(360px); opacity: 0; }
    }

    /* 3. Main Title Pulsing Glow */
    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.7)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
        opacity: 0.95;
      }
      50% {
        filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.95)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.8));
        opacity: 1;
      }
    }

    /* 4. Falling Matrix Data Drops */
    @keyframes matrixDrop {
      0% { transform: translateY(-40px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(360px); opacity: 0; }
    }

    /* 5. Constellation Floating Nodes */
    @keyframes nodeFloat {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(6px, -8px) scale(1.3); opacity: 1; }
    }

    .bg-main { fill: url(#cyber-bg); rx: 14px; }
    .grid-layer { fill: url(#grid); }
    .laser-line { animation: laserScan 4s linear infinite; }
    .main-title {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 4px;
      fill: url(#title-grad);
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .sub-title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #FF0055;
    }
    .header-tag {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: #00F0FF;
    }
    .badge-text {
      font-family: 'Consolas', monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #00F0FF;
    }
    .cursor-line {
      fill: #00F0FF;
      animation: cursorBlink 1s infinite;
    }
    .tag-chip {
      font-family: 'Consolas', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #94A3B8;
    }
    .matrix-text { animation: matrixDrop 4.5s linear infinite; }
    .node-anim { animation: nodeFloat 4s infinite ease-in-out; }
  </style>

  <!-- Background Base & Grid -->
  <rect width="800" height="360" class="bg-main" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
  <rect width="800" height="360" class="grid-layer" rx="14" />

  <!-- Falling Matrix Binary & Code Stream -->
  <g fill="#00F0FF" font-family="monospace" font-size="9" font-weight="700">
    <text x="70" y="0" class="matrix-text" style="animation-delay: 0.2s;">1 0 1 0</text>
    <text x="190" y="0" class="matrix-text" style="animation-delay: 1.8s;">SPRING</text>
    <text x="310" y="0" class="matrix-text" style="animation-delay: 0.9s;">0 1 1 0</text>
    <text x="490" y="0" class="matrix-text" style="animation-delay: 2.5s;">C++ OOP</text>
    <text x="610" y="0" class="matrix-text" style="animation-delay: 1.2s;">REST API</text>
    <text x="730" y="0" class="matrix-text" style="animation-delay: 2.9s;">1 1 0 1</text>
  </g>

  <!-- HUD Side Ticks -->
  <path d="M 12 140 L 22 140 M 12 150 L 18 150 M 12 160 L 18 160 M 12 170 L 22 170" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 788 140 L 778 140 M 788 150 L 782 150 M 788 160 L 782 160 M 788 170 L 778 170" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Corner Brackets -->
  <path d="M 15 40 L 15 15 L 40 15" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />
  <path d="M 760 15 L 785 15 L 785 40" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />
  <path d="M 15 320 L 15 345 L 40 345" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />
  <path d="M 760 345 L 785 345 L 785 320" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)" />

  <!-- Constellation Left -->
  <g stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1">
    <line x1="40" y1="220" x2="90" y2="290" />
    <line x1="90" y1="290" x2="170" y2="250" />
    <line x1="90" y1="290" x2="190" y2="315" />
  </g>
  <g class="node-anim">
    <circle cx="40" cy="220" r="4" fill="#00F0FF" filter="url(#neon-glow)" />
    <circle cx="90" cy="290" r="5" fill="#FFFFFF" filter="url(#neon-glow)" />
    <circle cx="170" cy="250" r="4" fill="#00F0FF" filter="url(#neon-glow)" />
  </g>

  <!-- Constellation Right -->
  <g stroke="#A855F7" stroke-opacity="0.3" stroke-width="1">
    <line x1="760" y1="50" x2="700" y2="110" />
    <line x1="700" y1="110" x2="620" y2="70" />
  </g>
  <g class="node-anim">
    <circle cx="760" cy="50" r="4" fill="#A855F7" filter="url(#purple-glow)" />
    <circle cx="700" cy="110" r="5" fill="#00F0FF" filter="url(#neon-glow)" />
    <circle cx="620" cy="70" r="4" fill="#A855F7" filter="url(#purple-glow)" />
  </g>

  <!-- Animated Laser Scanline -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00F0FF" stroke-opacity="0.8" stroke-width="2" class="laser-line" filter="url(#neon-glow)" />

  <!-- Top Ribbon Badge -->
  <text x="50%" y="58" text-anchor="middle" class="header-tag" filter="url(#neon-glow)">⚡ WELCOME TO MY GITHUB SPACE</text>

  <!-- Main Name Header -->
  <text x="50%" y="125" text-anchor="middle" class="main-title" filter="url(#neon-glow)">MUHAMMAD TAYYAB SHAH</text>

  <!-- Subtitle Line -->
  <text x="50%" y="165" text-anchor="middle" class="sub-title">SOFTWARE ENGINEERING STUDENT @ CUST ISLAMABAD</text>

  <!-- Detailed Tech Badges Row -->
  <g transform="translate(0, 185)">
    <!-- Badge 1: GPA -->
    <rect x="130" y="0" width="115" height="24" rx="12" fill="#030810" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="187" y="16" text-anchor="middle" class="tag-chip"><tspan fill="#00F0FF">GPA:</tspan> 3.65/4.0</text>

    <!-- Badge 2: Role -->
    <rect x="255" y="0" width="130" height="24" rx="12" fill="#030810" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1" />
    <text x="320" y="16" text-anchor="middle" class="tag-chip"><tspan fill="#A855F7">Class Representative</tspan></text>

    <!-- Badge 3: Tech Stack -->
    <rect x="395" y="0" width="140" height="24" rx="12" fill="#030810" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="465" y="16" text-anchor="middle" class="tag-chip"><tspan fill="#00F0FF">Java</tspan> • Spring Boot</text>

    <!-- Badge 4: Full Stack -->
    <rect x="545" y="0" width="125" height="24" rx="12" fill="#030810" stroke="#FF0055" stroke-opacity="0.4" stroke-width="1" />
    <text x="607" y="16" text-anchor="middle" class="tag-chip"><tspan fill="#FF0055">Full-Stack</tspan> Web</text>
  </g>

  <!-- Terminal Typing Box with Blinking Cursor -->
  <g filter="url(#neon-glow)">
    <rect x="250" y="240" width="300" height="42" rx="10" fill="#030810" fill-opacity="0.9" stroke="#00F0FF" stroke-opacity="0.85" stroke-width="1.5" />
    <!-- Outer Corner Accents -->
    <path d="M 253 248 L 253 243 L 258 243" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <path d="M 547 243 L 547 248 L 542 248" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    
    <!-- Terminal Output Text -->
    <text x="390" y="266" text-anchor="middle" class="badge-text">> Systems Builder</text>
    <!-- Blinking Cursor -->
    <rect x="470" y="252" width="8" height="16" class="cursor-line" />
  </g>
</svg>
