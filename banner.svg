<svg width="100%" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cyberpunk Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030810" />
      <stop offset="40%" stop-color="#081120" />
      <stop offset="80%" stop-color="#050A14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Cyan & Purple Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern overlay -->
    <pattern id="grid-pattern" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="0.8" />
    </pattern>

    <!-- Title Multi-Tone Neon Gradient (Cyan -> White -> Purple) -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8B4FE" />
    </linearGradient>

    <!-- Top Glow Sphere -->
    <radialGradient id="header-glow" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* 1. Main Title Pulsing Neon Glow */
    @keyframes titleGlowPulse {
      0%, 100% {
        filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.7)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.5));
        opacity: 0.95;
      }
      50% {
        filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.95)) drop-shadow(0 0 45px rgba(168, 85, 247, 0.85));
        opacity: 1;
      }
    }

    /* 2. Sweeping Horizontal Laser Line */
    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    /* 3. Constellation Nodes Sparkle & Float */
    @keyframes nodeFloat1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(6px, -8px) scale(1.3); opacity: 1; }
    }
    @keyframes nodeFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(-8px, 6px) scale(1.4); opacity: 0.95; }
    }

    /* 4. Subtitle Blink/Pulse */
    @keyframes subPulse {
      0%, 100% { opacity: 0.85; fill: #F472B6; }
      50% { opacity: 1; fill: #FF0055; filter: drop-shadow(0 0 8px #FF0055); }
    }

    /* 5. Matrix Code Drops Falling Animation */
    @keyframes matrixDrop {
      0% { transform: translateY(-30px); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.5; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    .bg-main { fill: url(#cyber-bg); rx: 10px; }
    .grid-layer { fill: url(#grid-pattern); }
    .title-text {
      font-family: 'Consolas', 'Orbitron', 'Courier New', monospace;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 4px;
      fill: url(#title-gradient);
      animation: titleGlowPulse 3s infinite ease-in-out;
    }
    .top-header-text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3.5px;
      fill: #00F0FF;
    }
    .sub-title-text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      animation: subPulse 3.5s infinite ease-in-out;
    }
    .laser-line { animation: laserScan 4s linear infinite; }
    .node-group-1 { animation: nodeFloat1 4s infinite ease-in-out; }
    .node-group-2 { animation: nodeFloat2 5s infinite ease-in-out; }
    .matrix-drop { animation: matrixDrop 4s linear infinite; }
  </style>

  <!-- Background Base & Grid -->
  <rect width="800" height="320" class="bg-main" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
  <rect width="800" height="320" class="grid-layer" rx="10" />

  <!-- Top Ambient Glow Sphere -->
  <circle cx="400" cy="0" r="250" fill="url(#header-glow)" />

  <!-- Background Falling Code / Matrix Drops -->
  <g fill="#00F0FF" font-family="monospace" font-size="9" font-weight="700">
    <text x="100" y="0" class="matrix-drop" style="animation-delay: 0.2s;">1 0 1</text>
    <text x="210" y="0" class="matrix-drop" style="animation-delay: 1.5s;">0 1 0</text>
    <text x="320" y="0" class="matrix-drop" style="animation-delay: 0.8s;">1 1 0</text>
    <text x="500" y="0" class="matrix-drop" style="animation-delay: 2.2s;">0 0 1</text>
    <text x="630" y="0" class="matrix-drop" style="animation-delay: 1.1s;">1 0 1</text>
    <text x="730" y="0" class="matrix-drop" style="animation-delay: 2.7s;">0 1 1</text>
  </g>

  <!-- Bottom Left Cyan Particle Constellation Network -->
  <g stroke="#00F0FF" stroke-opacity="0.35" stroke-width="0.8">
    <line x1="30" y1="210" x2="80" y2="280" />
    <line x1="80" y1="280" x2="160" y2="240" />
    <line x1="160" y1="240" x2="230" y2="295" />
    <line x1="80" y1="280" x2="180" y2="305" />
    <line x1="160" y1="240" x2="100" y2="180" />
    <line x1="100" y1="180" x2="30" y2="210" />
  </g>
  <g class="node-group-1">
    <circle cx="30" cy="210" r="3.5" fill="#00F0FF" filter="url(#glow-cyan)" />
    <circle cx="80" cy="280" r="4.5" fill="#00F0FF" filter="url(#glow-cyan)" />
    <circle cx="160" cy="240" r="5" fill="#FFFFFF" filter="url(#glow-cyan)" />
    <circle cx="230" cy="295" r="3.5" fill="#00F0FF" />
    <circle cx="100" cy="180" r="4" fill="#00F0FF" filter="url(#glow-cyan)" />
  </g>

  <!-- Top Right Purple/Cyan Particle Constellation Network -->
  <g stroke="#A855F7" stroke-opacity="0.35" stroke-width="0.8">
    <line x1="770" y1="30" x2="710" y2="100" />
    <line x1="710" y1="100" x2="630" y2="60" />
    <line x1="630" y1="60" x2="570" y2="120" />
    <line x1="710" y1="100" x2="750" y2="160" />
    <line x1="630" y1="60" x2="680" y2="20" />
  </g>
  <g class="node-group-2">
    <circle cx="770" cy="30" r="3.5" fill="#A855F7" filter="url(#glow-purple)" />
    <circle cx="710" cy="100" r="5" fill="#00F0FF" filter="url(#glow-cyan)" />
    <circle cx="630" cy="60" r="4.5" fill="#A855F7" filter="url(#glow-purple)" />
    <circle cx="570" cy="120" r="3.5" fill="#00F0FF" />
    <circle cx="750" cy="160" r="4" fill="#A855F7" filter="url(#glow-purple)" />
  </g>

  <!-- Outer HUD Corner Brackets (Exact image frame brackets) -->
  <path d="M 15 40 L 15 15 L 40 15" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow-cyan)" />
  <path d="M 760 15 L 785 15 L 785 40" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow-cyan)" />
  <path d="M 15 280 L 15 305 L 40 305" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow-cyan)" />
  <path d="M 760 305 L 785 305 L 785 280" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow-cyan)" />

  <!-- Side Technical HUD Tick Marks -->
  <path d="M 12 120 L 22 120 M 12 130 L 18 130 M 12 140 L 18 140 M 12 150 L 22 150" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 788 120 L 778 120 M 788 130 L 782 130 M 788 140 L 782 140 M 788 150 L 778 150" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Animated Moving Horizontal Scanline -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00F0FF" stroke-opacity="0.85" stroke-width="2" class="laser-line" filter="url(#glow-cyan)" />

  <!-- Top Header Badge -->
  <g filter="url(#glow-cyan)">
    <text x="50%" y="62" text-anchor="middle" class="top-header-text">⚡ WELCOME TO MY GITHUB SPACE</text>
  </g>

  <!-- Main Name Header Text -->
  <text x="50%" y="130" text-anchor="middle" class="title-text" filter="url(#glow-cyan)">MUHAMMAD TAYYAB SHAH</text>

  <!-- Subtitle Text -->
  <text x="50%" y="172" text-anchor="middle" class="sub-title-text">SOFTWARE ENGINEERING STUDENT @ CUST ISLAMABAD</text>

  <!-- Cyber Pill Badge Box (Centered at bottom) -->
  <g filter="url(#glow-cyan)">
    <rect x="280" y="210" width="240" height="42" rx="10" fill="#030810" fill-opacity="0.9" stroke="#00F0FF" stroke-opacity="0.8" stroke-width="1.5" />
    <!-- Outer corner accents on the badge box -->
    <path d="M 283 218 L 283 213 L 288 213" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <path d="M 517 213 L 517 218 L 512 218" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    
    <!-- Badge Inner Text -->
    <text x="50%" y="237" text-anchor="middle" font-family="&#39;Consolas&#39;, monospace" font-size="15" font-weight="800" fill="#00F0FF">> Systems Builder</text>
  </g>
</svg>
